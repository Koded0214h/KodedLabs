<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- black field -->
  <rect width="32" height="32" fill="#000"/>

  <!-- top + bottom grid bars -->
  <rect x="0" y="5"  width="32" height="1" fill="rgba(255,255,255,0.22)"/>
  <rect x="0" y="26" width="32" height="1" fill="rgba(255,255,255,0.22)"/>

  <!-- K glyph — hand-drawn paths so it renders perfectly at 16 / 32 px -->
  <!-- vertical stem -->
  <rect x="7" y="9" width="3" height="14" fill="#fff"/>
  <!-- upper diagonal arm -->
  <polygon points="10,9 14,9 21,16 17,16" fill="#fff"/>
  <!-- lower diagonal arm -->
  <polygon points="10,23 14,23 22,23 18,16 14,16" fill="#fff"/>
</svg>
